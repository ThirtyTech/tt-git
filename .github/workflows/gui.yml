name: GUI

# The desktop app (crates/tt-git-gui) on its own, so a GPUI build failure
# doesn't block the TUI's jobs in ci.yml, which leave it out.

on:
  push:
    branches: [main, gui]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gui:
    name: tt-git-gui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # GPUI's build is large; keep it apart from the TUI jobs' cache.
          shared-key: gui
      # What GPUI needs to build on Linux (X11 and Wayland, fonts, Vulkan),
      # as gpui-kit's own CI installs it.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libssl-dev libzstd-dev libasound2-dev libvulkan1
      - name: Build
        run: cargo build -p tt-git-gui --locked
      - name: Clippy
        run: cargo clippy -p tt-git-gui --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test -p tt-git-gui --locked
