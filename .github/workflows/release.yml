name: Release

# Builds tt-git for each platform and publishes a GitHub release when a
# version tag (v1.2.3, v1.2.3-rc.1) is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Every target builds natively on its own runner, so there's no
# cross-compiling. Tags with a pre-release suffix are marked as pre-releases.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x64
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            name: macos-arm64
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            name: windows-x64
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            name: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p tt-git --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="tt-git-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$name"
          cp README.md "$name"/
          [ -f LICENSE ] && cp LICENSE "$name"/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/tt-git.exe" "$name"/
            7z a "$name.zip" "$name" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/tt-git" "$name"/
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: tt-git-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum tt-git-* > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes $prerelease
