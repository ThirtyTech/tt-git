name: Release

# Builds tt-git for each platform and publishes a GitHub release when a
# version tag (v1.2.3, v1.2.3-rc.1) is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Every target builds natively on its own runner, so there's no
# cross-compiling. Tags with a pre-release suffix are marked as pre-releases.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag must name the version the binary reports, so `tt-git --version`
  # matches the release it came from. Bump `version` in Cargo.toml first.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo version
        shell: bash
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "tt-git") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tt-git version $crate in Cargo.toml"
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x64
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            name: macos-arm64
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            name: windows-x64
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            name: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p tt-git --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="tt-git-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$name"
          cp README.md "$name"/
          [ -f LICENSE ] && cp LICENSE "$name"/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/tt-git.exe" "$name"/
            7z a "$name.zip" "$name" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/tt-git" "$name"/
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: tt-git-*.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum tt-git-* > SHA256SUMS.txt
      - name: Add install script
        run: cp install.sh install.ps1 dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh"
          {
            echo '## Install'
            echo
            echo 'Linux (x64, arm64) and macOS (Apple Silicon):'
            echo
            echo '```sh'
            echo "curl -fsSL $url | TTGIT_VERSION=$GITHUB_REF_NAME sh"
            echo '```'
            echo
            echo 'Windows (x64, arm64), in PowerShell:'
            echo
            echo '```powershell'
            echo "\$env:TTGIT_VERSION = '$GITHUB_REF_NAME'; irm ${url%.sh}.ps1 | iex"
            echo '```'
            echo
          } > notes.md
          # --generate-notes appends the changelog after notes.md.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes $prerelease
