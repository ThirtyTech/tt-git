  </g>

  <!-- Behind the app's icon -->
  <circle cx="190" cy="205" r="96" fill="url(#iconGlow)" />

  <!-- The arrow, drawn as a branch lane with commits on it -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="268" y1="205" x2="388" y2="205" stroke="url(#lane)" stroke-width="4" />
    <path d="M 376 195 L 390 205 L 376 215" stroke="#4BC0EB" stroke-width="4" />
    <circle cx="292" cy="205" r="7" fill="#090B0E" stroke="url(#coreGlow)" stroke-width="3" />
    <circle cx="292" cy="205" r="2.6" fill="#7BD938" stroke="none" />
    <circle cx="334" cy="205" r="5.5" fill="#090B0E" stroke="#4BC0EB" stroke-width="2.6" />
  </g>

  <!-- Tags for Finder's black icon names -->
  <rect x="134" y="277" width="112" height="22" rx="11" fill="#DCE5EE" />
  <rect x="414" y="277" width="112" height="22" rx="11" fill="#DCE5EE" />

  <text x="330" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8B95A5">Drag tt-git to Applications to install it.</text>
</svg>
