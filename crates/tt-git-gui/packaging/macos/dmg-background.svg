<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420">
  <!-- The .dmg window's background, after the Windows installer's sidebar
       (../windows/sidebar.svg, whose icon, wordmark and footer paths it
       reuses). 660x420 points, the window's size in package.sh. Finder
       draws the icons on top, centred at (190, 205) and (470, 205), and
       always draws their names in black on a picture background, hence
       the light tags under them. Rendered to dmg-background.png and
       dmg-background@2x.png. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11151C" />
      <stop offset="60%" stop-color="#0B0E13" />
      <stop offset="100%" stop-color="#07090C" />
    </linearGradient>
    <radialGradient id="glowTop" cx="22%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#4BC0EB" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#4BC0EB" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowMerge" cx="78%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#7BD938" stop-opacity="0.09" />
      <stop offset="55%" stop-color="#4BC0EB" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#090B0E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4BC0EB" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#4BC0EB" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141A23" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0B0F15" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="lane" gradientUnits="userSpaceOnUse" x1="268" y1="0" x2="392" y2="0">
      <stop offset="0%" stop-color="#006698" />
      <stop offset="100%" stop-color="#4BC0EB" />
    </linearGradient>
    <linearGradient id="ttCyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4BC0EB" />
      <stop offset="55%" stop-color="#006698" />
      <stop offset="100%" stop-color="#171312" />
    </linearGradient>
    <linearGradient id="ttGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8A8A7" />
      <stop offset="65%" stop-color="#6E6E6D" />
      <stop offset="100%" stop-color="#23201F" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4BC0EB" />
      <stop offset="100%" stop-color="#7BD938" />
    </linearGradient>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>
  </defs>

  <rect width="660" height="420" fill="url(#bg)" />
  <rect width="660" height="420" fill="url(#glowTop)" />
  <rect width="660" height="420" fill="url(#glowMerge)" />

  <!-- Faint commit graph along the bottom edge -->
  <g opacity="0.35" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 40 398 L 250 398 L 278 382 L 420 382 L 448 398 L 620 398" stroke="#006698" stroke-width="2.5" />
    <path d="M 130 398 L 158 410 L 330 410 L 358 398" stroke="#929291" stroke-width="2.5" />
    <circle cx="130" cy="398" r="4" fill="#090B0E" stroke="#4BC0EB" stroke-width="2" />
    <circle cx="244" cy="410" r="4" fill="#090B0E" stroke="#929291" stroke-width="2" />
    <circle cx="350" cy="382" r="4" fill="#090B0E" stroke="#4BC0EB" stroke-width="2" />
    <circle cx="530" cy="398" r="4" fill="#090B0E" stroke="#7BD938" stroke-width="2" />
  </g>

  <!-- The card -->
  <rect x="28" y="24" width="604" height="344" rx="18" fill="url(#card)" stroke="#263040" stroke-width="1.2" />
  <line x1="48" y1="94" x2="612" y2="94" stroke="#1E2633" stroke-width="1" />

  <!-- Header: the app icon and the wordmark, and THIRTYTECH on the right -->
  <g transform="translate(46, 41) scale(0.07)">
    <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tileBg)" stroke="#263040" stroke-width="6" />
    <polygon points="256,112 381,184 256,256 131,184" fill="#1C2433" opacity="0.5" />
    <polygon points="131,184 256,256 256,400 131,328" fill="#131924" opacity="0.7" />
    <polygon points="256,256 381,184 381,328 256,400" fill="#0B0F17" opacity="0.8" />
    <path d="M 232 68 L 96 146 L 96 276" fill="none" stroke="url(#ttGrey)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="114" cy="342" r="14" fill="#929291" />
    <circle cx="164" cy="382" r="14" fill="#929291" />
    <path d="M 416 236 L 416 366 L 256 456 L 214 432" fill="none" stroke="url(#ttCyan)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="312" cy="92" r="14" fill="#4BC0EB" />
    <circle cx="372" cy="128" r="14" fill="#4BC0EB" />
    <path d="M 148 194 L 256 256 L 256 388" fill="none" stroke="#929291" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 196 166 L 148 194 L 148 258" fill="none" stroke="#929291" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 364 194 L 256 256" fill="none" stroke="#4BC0EB" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 316 166 L 364 194 L 364 258" fill="none" stroke="#4BC0EB" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="256" y1="124" x2="256" y2="256" stroke="#4BC0EB" stroke-width="20" stroke-linecap="round" />
    <circle cx="256" cy="256" r="30" fill="#090B0E" stroke="url(#coreGlow)" stroke-width="13" />
    <circle cx="256" cy="256" r="11" fill="#4BC0EB" />
    <circle cx="256" cy="124" r="16" fill="#090B0E" stroke="#4BC0EB" stroke-width="9" />
    <circle cx="148" cy="194" r="16" fill="#090B0E" stroke="#929291" stroke-width="9" />
    <circle cx="364" cy="194" r="16" fill="#090B0E" stroke="#4BC0EB" stroke-width="9" />
    <circle cx="256" cy="388" r="16" fill="#090B0E" stroke="#929291" stroke-width="9" />
  </g>
