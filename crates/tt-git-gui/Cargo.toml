[package]
name = "tt-git-gui"
description = "tt-git's desktop app, drawn with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "tt-git-gui"
path = "src/main.rs"

[dependencies]
# GPUI through gpui-kit, which pins the gpui-pre snapshot gpui-component is
# built on (gpui-pre =0.3.9, zed@93d7456) and re-exports both, so the two
# always match. Named `gpui` so GPUI's macros resolve through it.
gpui = { package = "gpui-kit", version = "=0.8.0" }
clap.workspace = true
color-eyre.workspace = true
serde.workspace = true
serde_json.workspace = true
# Checks a downloaded update against the release's SHA256SUMS.txt.
sha2 = "0.10"
thiserror.workspace = true
# The window icon on X11 (`WindowOptions::icon`), decoded from assets/icon.png.
image = { version = "0.25", default-features = false, features = ["png"] }
# rt-multi-thread for the runtime `gpui_tokio` starts.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tt-git-app.workspace = true
tt-git-core.workspace = true
tt-git-plugin.workspace = true
unicode-width = "0.2"

# The taskbar (jump list, progress, overlay badge).
[target.'cfg(windows)'.dependencies]
# A window's HWND, for the taskbar; GPUI's `Window` gives it through this.
raw-window-handle = "0.6"
# The Win32 calls, kept out of this crate: it forbids unsafe code.
tt-git-win.workspace = true

# The launcher's badge and progress (launcher_entry.rs), over the session
# bus. GPUI already builds zbus for the desktop portals.
# The notifications through the desktop's Notification portal (notify/portal.rs).
# async-io, as GPUI's own ashpd uses: zbus then needs no tokio runtime.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "notification"] }
futures.workspace = true

# The Quick Look panel.
[target.'cfg(target_os = "macos")'.dependencies]
# The Objective-C calls, kept out of this crate: it forbids unsafe code.
tt-git-win.workspace = true

[build-dependencies]
# The icon resource in the Windows executable (build.rs).
embed-resource = "3"

[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.8.0", features = ["test-support"] }
tempfile.workspace = true
tt-git-testkit.workspace = true

[lints]
workspace = true
