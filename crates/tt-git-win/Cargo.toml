[package]
name = "tt-git-win"
description = "The OS calls behind tt-git-gui's Windows and macOS integration, and the power state for both apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tracing.workspace = true

# The version GPUI already uses, so it isn't built twice.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Networking_Connectivity",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Power",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# The badge_probe example: its decoy window, moving the focus, the taskbar's
# buttons through UI Automation, and reading their pixels off the screen.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# The versions GPUI already uses on macOS, so they aren't built twice.
# block2 is for the network path monitor's update handler (power/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSPanel",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSEnumerator",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = [
    "std",
    "QLPreviewItem",
    "QLPreviewPanel",
    "objc2-app-kit",
] }

# The power and network state over the system bus (power/linux.rs), with
# zbus's blocking API. The desktop app already builds zbus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# The workspace forbids unsafe code. This crate is the one place that allows
# it, because every Win32, COM and Objective-C call is unsafe: the rest of tt-git stays at
# forbid and calls the safe functions here. Each unsafe block says why it's
# sound in a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
