<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11151C" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>
    <!-- ThirtyTech Cyan Gradient -->
    <linearGradient id="ttCyan5a" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4BC0EB" />
      <stop offset="55%" stop-color="#006698" />
      <stop offset="100%" stop-color="#171312" />
    </linearGradient>
    <!-- ThirtyTech Grey Gradient -->
    <linearGradient id="ttGrey5a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8A8A7" />
      <stop offset="65%" stop-color="#6E6E6D" />
      <stop offset="100%" stop-color="#23201F" />
    </linearGradient>
    <linearGradient id="coreGlow5a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4BC0EB" />
      <stop offset="100%" stop-color="#7BD938" />
    </linearGradient>
  </defs>

  <!-- Squircle Tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg5a)" stroke="#222936" stroke-width="4" />

  <!-- Subtle Isometric Cube Faces in the Center -->
  <polygon points="256,112 381,184 256,256 131,184" fill="#1C2433" opacity="0.45" />
  <polygon points="131,184 256,256 256,400 131,328" fill="#131924" opacity="0.65" />
  <polygon points="256,256 381,184 381,328 256,400" fill="#0B0F17" opacity="0.75" />

  <!-- ThirtyTech Signature Segmented Hexagon Frame:
       Top-Left Solid Arc (Grey Gradient) + Bottom-Left 2 Trailing Dots (#929291) -->
  <path d="M 232 68 L 96 146 L 96 276" fill="none" stroke="url(#ttGrey5a)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="114" cy="342" r="14" fill="#929291" />
  <circle cx="164" cy="382" r="14" fill="#929291" />

  <!-- Bottom-Right Solid Arc (ThirtyTech Cyan Gradient) + Top-Right 2 Trailing Dots (#4BC0EB) -->
  <path d="M 416 236 L 416 366 L 256 456 L 214 432" fill="none" stroke="url(#ttCyan5a)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="312" cy="92" r="14" fill="#4BC0EB" />
  <circle cx="372" cy="128" r="14" fill="#4BC0EB" />

  <!-- Inner Isometric Dual-T Commit Graph -->
  <!-- Left Branch ('3' / Left 't' in ThirtyTech Silver-Grey) -->
  <path d="M 148 194 L 256 256 L 256 388" fill="none" stroke="#929291" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 196 166 L 148 194 L 148 258" fill="none" stroke="#929291" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Branch ('0' / Right 't' in ThirtyTech Cyan #4BC0EB) -->
  <path d="M 364 194 L 256 256" fill="none" stroke="#4BC0EB" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 316 166 L 364 194 L 364 258" fill="none" stroke="#4BC0EB" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Merge Spine -->
  <line x1="256" y1="124" x2="256" y2="256" stroke="#4BC0EB" stroke-width="20" stroke-linecap="round" />

  <!-- Central Isometric Merge Node ◉ -->
  <circle cx="256" cy="256" r="30" fill="#090B0E" stroke="url(#coreGlow5a)" stroke-width="13" />
  <circle cx="256" cy="256" r="11" fill="#4BC0EB" />

  <!-- Satellite Commit Nodes -->
  <circle cx="256" cy="124" r="16" fill="#090B0E" stroke="#4BC0EB" stroke-width="9" />
  <circle cx="148" cy="194" r="16" fill="#090B0E" stroke="#929291" stroke-width="9" />
  <circle cx="364" cy="194" r="16" fill="#090B0E" stroke="#4BC0EB" stroke-width="9" />
  <circle cx="256" cy="388" r="16" fill="#090B0E" stroke="#929291" stroke-width="9" />
</svg>
