[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/thirtytech/tt-git"

[workspace.dependencies]
tt-git-core = { path = "crates/tt-git-core" }
tt-git-graph = { path = "crates/tt-git-graph" }
tt-git-plugin = { path = "crates/tt-git-plugin" }
tt-git-tui = { path = "crates/tt-git-tui" }
tt-git-testkit = { path = "crates/tt-git-testkit" }

# Only for local time: the UTC offset in effect at a commit's date.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
# No capture-spantrace: tt-git enters no tracing spans and installs no
# ErrorLayer, so span traces would always be empty.
color-eyre = { version = "0.6", default-features = false, features = ["track-caller"] }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
etcetera = "0.11"
futures = "0.3"
ignore = "0.4"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thiserror = "2"
# The app uses a current-thread runtime; only the test driver needs rt-multi-thread.
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
# No ansi: logs go to a file, written with `with_ansi(false)`.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "std",
    "smallvec",
    "tracing-log",
] }

insta = "1"
tempfile = "3"
termlens = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimise dependencies (not workspace crates) in dev and test builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.insta]
opt-level = 3

# No `panic = "abort"`: `JobGuard` (tt-git-tui jobs.rs) relies on unwinding
# to keep the in-flight job count right when a job panics.
[profile.release]
lto = "fat"
codegen-units = 1
