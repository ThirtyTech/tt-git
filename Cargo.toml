[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/jsheely/tt-git"

[workspace.dependencies]
tt-git-core = { path = "crates/tt-git-core" }
tt-git-graph = { path = "crates/tt-git-graph" }
tt-git-plugin = { path = "crates/tt-git-plugin" }
tt-git-tui = { path = "crates/tt-git-tui" }
tt-git-testkit = { path = "crates/tt-git-testkit" }

clap = { version = "4", features = ["derive", "env"] }
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
etcetera = "0.11"
futures = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

insta = "1"
tempfile = "3"
termlens = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.insta]
opt-level = 3
